    notes: "排期 2026-08-07。兑现 K=V/Muon 文末预告：普通残差在 61 层「传话传没」。数学主线：HC 加宽残差流（n_hc=4）→ B 矩阵约束到双随机矩阵流形（Birkhoff 多面体，谱范数 ≤1 非扩张）→ Sinkhorn-Knopp 迭代（t_max=20）→ A/C 用 Sigmoid 限幅防信号抵消 → 动态参数化（输入相关 + 静态偏置）。V4 §2.2 + §3.4.2（recomputation/fused kernel 把 mHC 开销压到 pipeline 的 6.7%）+ mHC 专文。校准 07-09 残差连接篇的 MHC 伏笔。待 grill-me 出大纲。"

