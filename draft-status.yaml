  media_id: kOcXH4SytIYVIpYksTGfHlKsYVCJ3RgNlcASD7w3Phgi-43nhreL0mlGDQxi8lna
  cover_media_id: kOcXH4SytIYVIpYksTGfHmNybW46NlbO2QXxKErxhE5faLPGOTEJaqr1kyqu3Tq7
  notes:
  - '扩散模型数学系列篇 3（引导视角，系列收尾篇）。2026-09-22 当日完成全流程：grill 逐问收敛 12 轮（.grill/2026-09-22-diffusion-guidance.md）→ 大纲 → 原声槽 5/5 逐槽采集 → 两轮事实核查（子代理，全一手来源）→ 成稿 → 自跑三块实验 → 配图 8 张 → 16 项核查 → 存草稿箱。交付句 = 双转合一：转 1「条件控制不是往图里加东西，方向是贝叶斯分解给的、CFG 是不用训分类器的等价物」；转 2「γ 是两头都有代价的双刃旋钮，负向提示词就是把外推另一端的锚换掉」。六节链：一个「不」字听不懂 → 条件分数的贝叶斯分解 → 分类器引导与隐式分类器 → CFG 落地 → γ 在买什么 → 两个旋钮其实是同一根。'
  - '🔬 实验（`run_experiment.py`，seed 20260922，复用篇 2 的 8 峰 GMM 基建 + 每峰打类别标签；numpy 手写 MLP 无条件 + 类别条件网络）：① 方向验证（恒等式 ε_∅−ε_y = σ·∇log p(y|x) 对拍）② γ 扫描 ③ 出壳面板（并入②）④ 负向推力。**解析恒等式残差 5.33e-15**（推导无错）。**立项假设被自己推翻**：原假设「空地上方向对不上」不成立——方向处处正确（余弦 0.9924–0.9996），真问题是**幅度随噪声级别漂移**（投影比 0.748@σ=0.35 → 1.385@σ=0.05），这才是 γ 必须手调的根本原因。**两个代价不同段**：多样性 γ≈0.3 就付掉（归一化熵 0.8484→0.0569），出壳要 γ>3（13.13%@γ=5 → 51.4%@γ=12）。**锚一换安全区间骤窄**：同 γ=2.0，不带负向词 99.93% 守住目标，带相邻锚 99.53% 落到第三个峰（峰 7）——「写不要桌子反而画出别的」的玩具版。数字事实源 results.json。'
  - '⚠️ 本轮自查抓到并修掉一处**真 bug**：`analytic_eps` 条件支最初写成 `(x−μ_y)/σ`（未走单峰后验均值），致恒等式残差 11.4（应 ~0）；改为 `(σ_peak²x + σ²μ_y)/(σ_peak²+σ²)` 后降到 5.33e-15。另一处**数学修正**：负向词公式原写成 `ε(p_+) + γ(ε(c) − ε(p_−))`（锚与另一项语义混乱），改为 `ε(p_−) + γ(ε(p_+) − ε(p_−))`，并验证与论文 Eq.(5) 在 γ=1+w 下逐点等价（w = 0/1/3/7 全一致）。'
  - '📚 事实核查（全一手来源，2026-09-22）：CFG arXiv:2207.12598（w 扫描 0–4、最佳 FID 用 w=0.1/0.3、强引导饱和原话、p_uncond 0.1/0.2/0.5）｜分类器引导 arXiv:2105.05233（缩放恒等式、scale 1→概率约 50% / scale 10→近 100%、Recall 0.52→0.32、FID 4.59→9.11）｜过曝与重缩放 arXiv:2305.08891（"when w is large … causing the image over-exposure problem"、缩放系数 0.5–0.75）｜负向词 arXiv:2406.02965（Eq.(5) 经 LaTeX 源逐字核验、延迟生效 正向 4 步/负向 8 步、中性化、反向激活「前 3 步」、最优窗口第 5–15 步、动量 99.5%）｜Qwen-Image diffusers 源码（`true_cfg_scale` 默认 4.0、`guidance_scale` 默认 None、真 CFG 需 >1 且提供负向词、组合后范数重归一化）｜Wan2.1 `sample_guide_scale` 5.0 + 1.3B 建议 6、Wan2.2 双 guidance (3.0, 4.0) boundary 0.875、`shared_config.py` 官方默认负向词（首词「过曝」）。'
  - '🚩 事实红线（本轮新增，已写入 outline 与 grill 日志）：① 全文**不得**出现「负向提示词导致过曝」——一手依据显示因果相反，过曝归因给 w 过大；② 论文「前 3 步反向激活」必须标注为**研究干预**（只在特定步施加、之后停掉），不等于 UI 全程施加的常规行为；③ **不替 Qwen-Image 技术报告宣称用了 CFG**——报告 v1 全文 0 次提及 classifier-free/CFG/negative prompt（全文检索确认，且该文仅有 v1），可写的只是 diffusers 代码层事实。'
  - '🖼 配图 8 张（双轨）：封面 `00-cover.png` 1916x821 原生 21:9（第 2 次生成达标；第 1 版文字块 32.8% 超标，已留 `00-cover-v1.png`）；脚本图 3（A 方向对拍 / B γ 扫描 / C 负向推力）；AI 概念图 5（01 两个角色 / 02 外推 / 03 过曝 / 04 两支锚 / 05 收尾旋钮），逐张核验零文字零数字。**新增封面核查工具** `check_cover.py`：金色像素→连通域→只留汉字尺寸块→按「横向跨度 ≥45% 画面宽」筛出标题行；用篇 1/篇 2 已发封面标定（篇 2 读数 22.7%，与台账 ≈21% 相符），本篇 20.2% 达标。'
