    notes: "Muon 优化器解密篇（V4 技术报告 §2.4/§3.5.1/§4.2.2）。主线：AdamW 显存账（m/v 两份状态 → 状态减半）。数学深度：Newton-Schulz 迭代完整推导 + 二阶收敛 + 条件数 + 预条件三层表。双实验：NS 收敛性（κ 扫描）+ 更新方向特性（experiment.py 已跑）。兑现 07-10 篇 Muon/MuonClip 双伏笔；延伸 Kimi K2 MuonClip（QK-Clip 与 logit 爆炸分析，已核验 arXiv:2507.20534）。排篇说明：K=V 预告的 mHC 顺延下篇。配图 6 张已生成（封面 21:9 + 5 张正文图，prompt 与正文一致）。已保存至公众号草稿箱（remote-api，media_id: kOcXH4SytIYVIpYksTGfHrnYJAVgYBI6uvrrU3DNBOsFVX8w5N6KB3Arj8LF9ik3）。发布前在网页确认声明原创。"

