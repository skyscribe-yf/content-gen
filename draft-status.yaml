- slug: 2026-09-24-nonconvex-saddle
  title: 损失面上全是坑，为什么梯度下降还能走到谷底？
  series: 数学直觉
  status: published
  published_date: '2026-09-24'
  wechat_url: https://mp.weixin.qq.com/s/AYlFPXsMJJ0esCa_7_amrw
  files:
    weixin: true
    draft: false
    outline: true
    cover: true
  media_id: kOcXH4SytIYVIpYksTGfHsXjXzTfAkFjTOIIxeD8OQ7wIZWwIfW4FfBLg1thQyHu
  cover_media_id: kOcXH4SytIYVIpYksTGfHszwcX9-ZzwgxLrCU5mvz__YqEnQXqFGHhwEldGYfz7Y
  notes:
  - 数学直觉线新篇（非系列续集，独立开头零导航；合集「AI中的数学」）。2026-09-24 当日全流程：grill 逐问收敛 7 轮（`.grill/2026-09-24-nonconvex-saddle.md`）→ 大纲 → 原声槽 6 处逐槽采集（作者手打 5 处 + 槽 1 为作者原话经确认）→ 事实核查（14 条一手来源）→ 成稿 → 自跑三块实验 → 配图 7 张 → 门禁 → 存草稿箱。
  - ⭐ 本轮转折点（作者反向质疑）：作者回忆当年学吴恩达 Deep Learning Specialization 时，对「高维空间里鞍点大多因随机性更新就被跳出去、所以 SGD 能有效收敛」产生过很深的质疑，并提到业界不少人不以为然。核查结论三分：有据（Ge 2015 严格鞍点下 SGD 多项式步数收敛、自称首篇非凸 SGD 全局收敛保证；Jin 2017 逃逸代价仅维度的 poly-log、「almost for free」；Daneshmand ICML 2018 普通 SGD 沿负曲率方向噪声足够强、收敛率与维度无关）、有条件（严格鞍点 + 噪声在负曲率方向上有分量 + 随机初始化；Lee 2016 原话「almost surely with random initialization」）、有反例（Swirszcz 2016 构造数据集/初始化反例，原话 those results hold under very strong assumptions which are not satisfied by real models；Kawaguchi 2016 深层网络存在「Hessian 没有负特征值的坏鞍点」）。作者拍板份量 A：原六节结构不动，§4 补方向条件、新增一节「当年那句说法，到底对不对」，篇幅 3k→≈3.4k，槽 1 用课程质疑。
  - 交付句（补丁版双半句）：转 1 你不是掉进坑里出不来——高维空间里「坑」是稀有事件（一维 50% 的临界点是坑，二维 14.6%，五维 0.0125%，八维起抽样零命中）；转 2 就算站在鞍点/高原上，把你推下去的是噪声——但只有噪声落在负曲率方向上的那部分分量才算数（各向同性噪声是早期证明的技术假设，不是 SGD 的真实性质）。
  - 🔬 实验（`run_experiment.py`，seed 20260924，数字事实源 results.json，内置 11 条断言自检全过）：① 随机对称矩阵的指数统计——D=1/2/3/5 的「全部特征值全正」概率 50.0% / 14.6% / 2.46% / 0.0125%，D=8/10/20/50 分别抽样 10万/6万/2万/4千次全部零命中；实测每多一维 ×0.121（抛硬币粗估 2^-D 是 ×0.5，真实稀有度比粗估更狠）；平均负特征值个数/D 恰为 0.500（D=10 标准差 0.68 个方向）。② 真实随机场临界点普查——1D：95 个 = 47 谷底 + 48 山顶（谷底 49.5%，低维不稀有）；2D：334 个 = 98 谷底(29.3%) + 156 马鞍(46.7%) + 80 山顶(24.0%)。③ 对称性鞍点（小 MLP，同数据同步数）：全同初始化终损 1.203、单元间参数差 1.4e-17（对称从未破）；随机初始化 0.0038（差 313 倍）；全同+参数级独立噪声 σ=0.01 → 0.00080（最低）、参数差 0.741；全同+小批量噪声(batch=8) → 1.242、参数差 5.6e-17——既没破对称也没降损失；逐点梯度方差 vs 批量 log-log 斜率 −0.978（≈Var∝1/B）。
  - 📐 三处口径修正（均已落到正文）：修正 A 2^-D 只作「独立符号」粗估、量级陈述改挂实测 + Bray & Dean 指数分布；修正 B 小批量噪声不打破对称（同 batch 各单元梯度逐位相同），只有参数级彼此独立的随机性才打破——实验③最反直觉的结论；修正 C（作者质疑带出）逃逸定理必须带上「噪声要有负曲率方向分量」的条件。另修一处口径错：实验③最初记录单批损失，已改为全量数据损失并重跑，小批量组由 0.259 修正为 1.242（结论方向不变、更强）。
  - 📚 一手证据（14 条）：Dauphin 2014（saddle proliferation、high error plateaus、"give the illusory impression of the existence of local minima"）｜Choromanska 2015（局部极小数目随网络规模指数衰减，注意口径不是维度）｜Bray & Dean 2007 PRL 98:150201（临界点按能量与指数分布）｜Ge 2015｜Jin 2017｜Lee 2016｜Daneshmand ICML 2018｜Kawaguchi 2016｜Swirszcz 2016｜Fukumizu & Amari 2000（H−1 单元的临界点对应 H 单元的线状临界点 → 平台）｜HuggingFace 一手 config：deepseek-ai/DeepSeek-V4.1-Flash 的 text_config.initializer_range = 0.02（2026-09-10 上架，MIT）与 zai-org/GLM-5.3-Flash 文本/视觉侧同为 0.02。⚠️ 子代理通道被本机配置阻断（~/.pi/agent/settings.json 所有 agent override 用了已移除字段 fallbackModels，subagent list 直接报错），本轮核查改由主会话直接取一手来源完成。
  - 🖼 配图 7 张（双轨）：封面 00-cover.png 1916x821 原生 21:9（上游已给 21:9，无需裁剪；金色文字块 21.1% ≤ 1/4，两行标题逐字核验通过）；脚本图 3（04 局部极小占比 vs 维度断崖 / 05 指数分布集中在半数方向 / 06 三组初始化损失曲线，数字全在图上）；AI 概念图 3（01 一维三种临界点 / 02 高维马鞍 / 03 一排同步单元与一个被扰动者，逐张核验零文字零数字）。
  - 门禁：quality_check.py 全绿——正文 3585 字 / 含尾部 4302 字（尾部含热门榜 11 行与参考资料 12 条；正文落在作者 09-24 拍板的 ≈3.4k 推导密度豁免区间）；禁词 0；AI 腔 0；加粗失效 0；中文入公式 0（display 5 / inline 8，首轮 2 处已修）；超 60 字长句 0（原声段落豁免）；超 3 句段落 0；「待发布」残留 0；原声槽 6/6 逐字在场（slots.md 进稿版逐条比对）；图片 6 张同级路径、无 images/ 前缀；话题标签 5 个；一手/实验数字 21 项全在场；hot_articles.py --md --cited 重生成（11 行、行间无空行、行尾两空格）且 --self-check 通过；check_wechat_links.py 11 条 mp 链接全溯源。恢复期 B 六条过。
