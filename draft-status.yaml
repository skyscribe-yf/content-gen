- '2026-09-23 新篇立项：视觉生成机动组 G1「六根手指」——目录 `content/2026-09-23-hand-fingers/`，排期 09-23 20:00（门禁不过则顺延），grill 逐问收敛（`.grill/2026-09-23-hand-fingers.md`）。选题决策：视觉生成机动组（接 09-07/15/16/18/19 五篇，不做系列表述、开头零导航）。**两轮转向**：① 实验自测推翻原假设「像素损失看不见多一根手指」——在 5 指样本上训练的小模型能看出多指（AUC 0.97、损失 +86%）；站得住的是「损失按面积计价」与「MSE 最优解 = 条件平均」→ 作者拍板实验改为两块（平均实验 + 像素预算，砍掉面积账节）；② 事实核查（子代理，全一手）推翻原转 2「2026 年手画好了 + 按评测分档」——无任何一手评测给过 Qwen-Image-2.x / Seedream 5.0 / GPT-Image 2.5 的手部准确率；「手部专项数据/标注」零依据；Qwen-Image-2.0 报告反而指出 2K+ 分辨率会退化；Qwen-Image-2.x 的 VAE 是 16× 压缩（1.0 才是 8×8），Wan2.1 是 4×8×8、Wan2.2 是 16×16×4 不可混用 → 作者拍板终稿转 2 =「2026 年的最低分维度：20.9」（Qwen 自家 Qwen-Image-Bench arXiv:2605.28091v2：解剖保真度 56 维垫底、最好模型 20.9 分，总体第一 GPT Image 2 = 64.7）。**交付句**：转 1 像素损失里没有「手」——最优解是条件平均（平均解数出 9 条手指状条纹、损失只有正确解的 50%）+ 指缝预算（latent 里不足 1 像素的缝就被填平）；转 2 一打分就现原形（20.9 分垫底、三家官方能力清单无手部、行业靠外挂修手 HandRefiner/RHanDS + 手部专项评测 HandEval 2025-10 才出现）。**自跑实验**（`run_experiment.py`，seed 20260923，数字事实源 results.json）：实验①平均实验（模态间距 10.56 px，模型输出 = 解析平均，RMS 0.0005；条纹数 5 → 9；损失比 0.50）；实验②像素预算（指缝 latent 宽度 <0.3 px → 深度 0–2%、100% 填平；0.54 px → 36–41%、92% 填平；1.08–1.12 px → 67–73%；2.24 px → 89.5%）。配图 5 张（封面 + 脚本图 2 已出 + AI 概念图 2 待出）。**篇幅口径**：作者 09-23 拍板 ~2k 紧凑版，恢复期 B.3 的 3.5–5k 区间记豁免并已同步改写 `docs/wechat-ops.md` B.3 文字（AGENTS.md 本就写 2000 字左右）。今日不发贴图（禁同日同题材）。原声槽 5 处待逐槽采集。' 
