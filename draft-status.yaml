- slug: 2026-09-22-diffusion-guidance
  title: AI 生图写「不要桌子」，为什么反而画了猫？引导到底在拧什么
  series: 数学直觉
  status: published
  published_date: '2026-09-22'
  wechat_url: https://mp.weixin.qq.com/s/mLoiEHvPQTDSlg6RUb6DmQ
  files:
