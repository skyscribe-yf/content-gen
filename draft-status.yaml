  notes: '排期 2026-08-09。主线：无损压缩的算术（FP4→FP8 反量化无损）。双深潜：STE 直通梯度 + FP4→FP8 无损反量化（E4M3 多 2 个指数位、1×32 子块 / 128×128 块、scale 比值 ≤ 约 2×10³ 条件）。双实验（experiment.py 已跑通）：STE vs 截断收敛对比（截断 6.866 恒 / STE 0.993 / 基线 0.951）+ 无损性验证（≤2000× 误差 0，3000× 开始有损）。indexer 节正文兑现 99.7% recall（QK path FP4 + 分数 BF16 化 2× 加速）。结尾预告 KV 磁盘（08-10）。grill 日志：.grill/deepseek-fp4-qat.md。配图 5 张已生成（封面 21:9 + 4 张正文图，prompt 与正文一致，已逐张核验文字）。已保存至公众号草稿箱（remote-api，media_id: kOcXH4SytIYVIpYksTGfHvKPZ0WgbusGvIzWqLs_Lf2AoqOL1b7tGQhvAxunOZG-，封面 media_id: kOcXH4SytIYVIpYksTGfHtO54PEFEAWn0ck2htE6XzJXro4KKCu2PrAE48G0LNpS）。⚠️ 旧稿（media_id 以 …fHjLeOeRu 开头）作废，发布前请在草稿箱删除。发布前在网页确认声明原创。 文风迭代：2026-08-09 二稿按 style-guide.md 重写，去除说书腔（「先交代排篇」「今天拆三件事」等），注入人味八法（①埋我 7 处 / ②卡住 2 / ③比喻故事 / ⑤自嘲 / ⑥读论文时刻 / ⑦callback 带记忆 / ⑧承认不知道 / ⑨拉读者算账：专家权重 1.55T 占 97%，FP4 省 776GB≈再装一个 700B 模型），结尾改开放式显存话题。质量自检：无禁词、无超 60 字句、口语词 0。 2026-08-11 重存草稿（尾部改为「🔥 近期热门」Top 6 每篇一行，去掉合集箭头链），新 media_id: kOcXH4SytIYVIpYksTGfHo7bVdfJvHyYxQlSjJIcKxUZFlkHLuka3oPr6zaCsvs6（封面 media_id: kOcXH4SytIYVIpYksTGfHmBJIcBwiNeUxcAyE5Gd9d_FnS2j6SmGwx38L2vWyL8J）。旧草稿
