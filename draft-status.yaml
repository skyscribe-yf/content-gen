  - '🔬 一手事实链（三层，全核验）：① 原始论文 arXiv:2601.07372（2026-01-12，Cheng et al.，DeepSeek，github.com/deepseek-ai/Engram 官方开源；梁文锋列 22 作者末位——作者原声「创始人亲自署名」已核验）：27B Engram 对等参等 FLOPs MoE，MMLU +3.4 / BBH +5.0 / NIAH 84.2→97.0；稀疏度分配 U 形；消融保留率事实类 29–44% vs 阅读理解 81–93%（Figure 6）。② V4.1-Flash 技术报告 arXiv:2609.19969 全文：196B 分两模块挂第 1/14 层（平衡训练内存）、n-gram {2,3,4}×8 哈希头×~16M 条目/头（表长质数）、FP8、查询只依赖 token 序列故可预取、momentum+Sinkhorn 替代 Adam、RDMA 主机内存预取、RL rollout 常驻 GPU。③ Qwen3.8-Next arXiv:2608.30320：+51B n-gram 表放加速器之外；「词表加大 loss 单调降、下游精度饱和」作泼冷水节。GLM/小米无此模块（09-24 四家篇已核）。'
  - '⚠️ 六条事实红线（成稿自查过）：①「不参与计算」= 不进主干矩阵乘法，但全程参与训练（端到端梯度）；②「挂 CPU」= 推理时表驻主机内存 + RDMA 预取，训练时 GPU 分片，禁绝对化；③ 27B（实验规模）与 196B（落地规模）不混用；④「反超自家 Pro」一句带过防与 09-24 篇槽 3 自撞；⑤ 年份 2026；⑥ U 形是实验结论非定理。'
