  - '🔬 一手数据基线（MiMo_V2_6_technical_report.pdf，HF XiaomiMiMo/MiMo-V2.6-Pro-RL，SHA256 fb81e6e0…）：RL 总花费 $3,474,714 ≈ **2345 万元**（报告 §4.1 取整 $2.6M Pro + $0.9M Flash；个位值 2,620,670/854,044 为 TNS 从直播面板读的终值，层级不同须标来源）；成本三分（Figure 3 右侧饼图，已读图）Pro Training 43.5% / Rollout 43.8% / **Grader 12.7%**，Flash Training 40.9% / Rollout 44.9% / **Grader 14.2%**；DeepSWE v1.1 average@3（Figure 3 左图）Pro 58.4→**72.57**、Flash 48.7→**65.68**；单步 1,568 prompts × G=16 = 25K 序列、2.7B–3.7B tokens/步、上下文最长 1M；约 **7k 任务**（§7.2）+ 约 1k 音乐任务；9B 三级跳（Table 6）**RL 阶段 11/11 全涨**，Cyber 31.3→47.0（+15.7）、Terminal Bench 37.1→52.8（+15.7）、SWE-bench Verified 61.1→66.2（+5.1）；汇率 6.7489（中间价，chinamoney.com.cn 2026-09-27）。'
  - '⚠️ 本轮纠错 3 处（媒体/我自己的错，均已一手推翻）：① 「7000 个**环境**」→ 报告 §7.2 原文 "approximately 7k **tasks** in total"（四个训练集），是任务不是环境，环境是载体；② 「9B 跑 RL 只涨 0.1 分」→ 那是 oschina 把 SFT 后的 61.1 当成 RL 结果，实际 11/11 全涨，**必须在正文主动澄清否则像标题党**；③ 我在 grill 中途猜「Flash 的 grader 占 40.9%」**错了**——40.9% 是 Training，灰色 14.2% 才是 Grader。教训：饼图类数字必须读图不能靠图例顺序猜。'
