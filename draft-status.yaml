# Draft Status — single source of truth for all article states
#
# States (5-stage pipeline):
#   planned   →  drafting  →  ready  →  scheduled  →  published
#   选题已定       草稿中        可发布     已排期         已发表
#
# Transitions:
#   planned → drafting: draft.md created, writing started
#   drafting → ready:    draft polished, weixin.md finalized, all TODOs resolved
#   ready → scheduled:   publish date assigned, all platform versions ready
#   scheduled → published: article posted, wechatUrl recorded
#
# Key fields:
#   - slug: matches content/ directory name (date-topic format)
#   - status: one of planned | drafting | ready | scheduled | published
#   - files: auto-detected — update after each milestone
#   - wechat_url: fill immediately after publishing
#   - published_date: actual publish date (may differ from slug date)

