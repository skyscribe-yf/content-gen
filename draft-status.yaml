- slug: 2026-08-09-deepseek-fp8
  title: FP8训练：残缺数字怎么练出顶级模型
  series: DeepSeek 技术解密
  status: published
  published_date: '2026-08-09'
  wechat_url: https://mp.weixin.qq.com/s/yxrkmxPSZ8CnsFhWZ1bCPA
  files:
    weixin: true
    draft: true
    outline: true
    cover: true
  notes: '排期 2026-08-08。主线：残缺数字的工程美学（V3 FP8 工程探索，V4 继承）。双深潜：per-tensor vs per-group 量化误差 + online quantization。实验：outlier 量化误差对比（per-tensor 普通行 62.0% vs per-group 2.6%，改善 24 倍；权重场景揭示 128×128 粗粒度缘由）。结构 9 节、正文 3574 字、7 组公式（§2 补浮点范围具体例子）。关键校准（vs 第 9 课笔记）：全链路只用 E4M3（非 forward/backward 分流）；激活 1×128 tile / 权重 128×128 block；Online Quantization 非 Loss Scaling；H800 14-bit 累加陷阱 N_C=128；FP8 vs BF16 相对误差 < 0.25%（V3 附录 B）。标题 17 字。衔接 Muon 篇两处 FP8 线索；末尾预告 FP4 QAT。配图 5 张已生成（封面 21:9 + 4 正文图）。2026-08-08 打磨后已重新保存至公众号草稿箱（remote-api，新 media_id: kOcXH4SytIYVIpYksTGfHoiTJo_aAdd-rvREQ7gYHgDUx5T7oDXtSA6mT77JiVZH，封面 media_id: kOcXH4SytIYVIpYksTGfHi6GOjiGK_57l9eD6-SwzCHskRyKRpeAulAisA8uvfxd，citeStatus: true）。⚠️ 旧草稿（media_id: kOcXH4SytIYVIpYksTGfHqPqaakzpx18vk0YeklGLkeYVQZ_UFUYs5-PHzdfwhxx）作废，发布前请在草稿箱删除。发布前在网页确认声明原创。grill 日志：.grill/deepseek-fp8.md。2026-08-08 打磨：去说书腔（删「先交代排篇」「今天拆三件事」，标题改「mHC 篇的承诺，今天兑现」）；注入人味十处（①埋我×2：8 个台阶愣了 + 62% 以为是 bug 排查三遍 / ②卡住合并 ① / ③记账比喻开头 / ④闲笔×2：试出来的 128 间隔 + 结尾好系统直觉 / ⑤自嘲：以为 FP8 是 BF16 砍一半
    / ⑥读论文：附录 B 专门找大尺度数字 / ⑦callback 带记忆：Muon 留了两个尾巴 / ⑧承认不知道：非第三方复现，不当 FP8 无敌证据 / ⑨拉读者算账：1.6T 权重 BF16 3.2TB vs FP8 1.6TB）；结尾补 💬 开放留言问题（FP8 微调/推理经验）+ 点赞收藏 CTA；改「读者可能会想」→「你可能会想」、「我们一笔带过」→「这里就不展开了」；拆超长句 2 处。实验数字已复现（62.0%/2.6%/23.9 倍）。长句 0 超标、无禁词、话题标签 5 个。 2026-08-11 重存草稿（尾部改为「🔥 近期热门」Top 6 每篇一行，去掉合集箭头链），新 media_id: kOcXH4SytIYVIpYksTGfHh4KOLCgSt7o4vsqxZ5yQnt0IXorv36ekwp3IJRzW_dm（封面 media_id: kOcXH4SytIYVIpYksTGfHqKs0VEt4CL8sTSHY-SIAKKaMDNHb7-uIzEeDtm508gl）。旧草稿 kOcXH4SytIYVIpYksTGfHoiTJo_aAdd-rvREQ7gYHgDUx5T7oDXtSA6mT77JiVZH 及作废稿 kOcXH4SytIYVIpYksTGfHqPqaakzpx18vk0YeklGLkeYVQZ_UFUYs5-PHzdfwhxx 需在草稿箱删除。 2026-08-11 第三轮重存（--theme grace 蓝色主题 + 热门链接每行独立段落），**最终 media_id: kOcXH4SytIYVIpYksTGfHms_8-gF1LkrflPq5GC8Kz1DubJDFs80WtjQWB2MIO1P**。前两轮草稿（…Hh4KOLCg… 与 …HvAmfbsp…）均作废需删除。⚠️ wechat-api.ts 不读 EXTEND.md 的 default_theme，保存草稿必须显式加 --theme grace，否则渲染成 normal 黑白主题。 2026-08-09 发布前终检：wechatUrl 回填（去 query string）；Muon 正文首提处补内联链接（§1）；修复 §2「下一篇深潜」→「下一节深潜」（粒度深潜在本篇 §3）；拆分 §9 两处超长句（61/63 字 → 破折号改句号）；尾部在近期热门基础上补齐系列合集导航（DeepSeek
