<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>𝐗𝐀𝐁𝐂𝐈𝐌𝐆</title>
    <meta name="description" content="XABCIMG 作图 / 修图" />
    <link rel="canonical" href="https://xabcimg.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="𝐗𝐀𝐁𝐂𝐈𝐌𝐆" />
    <meta name="twitter:description" content="XABCIMG 作图 / 修图" />
    <meta name="twitter:image" content="https://xabcimg.com/apple-touch-icon.png" />
    <meta property="og:title" content="𝐗𝐀𝐁𝐂𝐈𝐌𝐆" />
    <meta property="og:description" content="XABCIMG 作图 / 修图" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xabcimg.com/" />
    <meta property="og:site_name" content="𝐗𝐀𝐁𝐂𝐈𝐌𝐆" />
    <meta property="og:image" content="https://xabcimg.com/apple-touch-icon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "url": "https://xabcimg.com/",
        "name": "𝐗𝐀𝐁𝐂𝐈𝐌𝐆",
        "logo": "https://xabcimg.com/apple-touch-icon.png"
      }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/apple-touch-icon.png" type="image/png" sizes="128x128" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <h1 class="brand-title">𝐗𝐀𝐁𝐂𝐈𝐌𝐆 <span>作图 / 修图</span></h1>
        <div id="accountBar" class="account-bar hidden">
          <span id="accountEmail"></span>
          <span id="accountBalance" class="balance-pill"></span>
          <button id="logoutButton" type="button">退出</button>
        </div>
      </header>

      <main>
        <section id="authView" class="auth-card">
          <form id="emailLoginForm" class="auth-form">
            <label>
              <span>邮箱</span>
              <input name="email" type="email" autocomplete="email" required />
              <small>我们会发送一个登录链接，首次登录会自动创建账号。</small>
            </label>
            <button type="submit" class="primary-button">发送登录链接</button>
          </form>
          <div id="loginLinkPanel" class="login-panel hidden">
            <div class="login-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 6h16v12H4z"></path>
                <path d="m4 7 8 6 8-6"></path>
              </svg>
            </div>
            <h2>登录邮件已发送</h2>
            <p>请前往 <strong id="loginEmail"></strong> 点击邮件中的链接完成登录。</p>
            <p class="login-note">邮件可能会有短暂延迟；如果收件箱没有看到，请检查垃圾信箱。</p>
            <div id="loginDevLink" class="login-dev-link hidden"></div>
            <div class="login-actions">
              <button id="resendLoginLink" type="button" class="primary-button">重新发送</button>
            </div>
          </div>
          <div id="authMessage" class="message hidden"></div>
        </section>

        <section id="appView" class="workspace hidden">
          <aside class="panel">
            <div class="panel-head">
              <h2>套餐</h2>
              <button id="refreshPlans" type="button">刷新</button>
            </div>
            <div id="plansGrid" class="plans-grid"></div>
            <div class="panel-head compact">
              <h2>订单</h2>
              <button id="refreshOrders" type="button">刷新</button>
            </div>
            <div id="ordersList" class="list"></div>
          </aside>

          <section class="panel">
            <div class="tool-tabs">
              <button id="generateTab" type="button" class="is-active">作图</button>
              <button id="editTab" type="button">修图</button>
            </div>

            <form id="generateForm" class="tool-form">
              <div class="grid-2">
                <label>
                  <span>模型</span>
                  <input name="model" value="gpt-image-2" />
                </label>
                <label>
                  <span>数量</span>
                  <input name="n" type="number" min="1" max="10" value="1" />
                </label>
              </div>
              <label>
                <span>提示词</span>
                <textarea name="prompt" rows="8" placeholder="写下要生成的画面"></textarea>
              </label>
              <label>
                <span>反向要求</span>
                <textarea name="avoid" rows="3" placeholder="不想出现的内容"></textarea>
              </label>
              <div class="grid-3">
                <label>
                  <span>尺寸</span>
                  <select name="size">
                    <option value="1024x1024">1024x1024</option>
                    <option value="1024x1536">1024x1536</option>
                    <option value="1536x1024">1536x1024</option>
                    <option value="2048x2048">2048x2048</option>
                    <option value="2048x1152">2048x1152</option>
                    <option value="3840x2160">3840x2160</option>
                    <option value="2160x3840">2160x3840</option>
                  </select>
                </label>
                <label>
                  <span>质量</span>
                  <select name="quality">
                    <option value="low">low</option>
                    <option value="medium" selected>medium</option>
                    <option value="high">high</option>
                    <option value="auto">auto</option>
                  </select>
                </label>
                <label>
                  <span>格式</span>
                  <select name="output_format">
                    <option value="png">png</option>
                    <option value="webp">webp</option>
                    <option value="jpeg">jpeg</option>
                  </select>
                </label>
              </div>
              <div class="cost-line">预计扣点：<span id="generateCost">1.000</span></div>
              <button type="submit" class="primary-button">开始作图</button>
            </form>

            <form id="editForm" class="tool-form hidden">
              <div class="grid-2">
                <label>
                  <span>模型</span>
                  <input name="model" value="gpt-image-2" />
                </label>
                <label>
                  <span>数量</span>
                  <input name="n" type="number" min="1" max="10" value="1" />
                </label>
              </div>
              <label>
                <span>原图</span>
                <input name="image" type="file" accept="image/*" multiple />
              </label>
              <div id="editSourcePreview" class="edit-source hidden"></div>
              <label>
                <span>蒙版</span>
                <input name="mask" type="file" accept="image/*" />
              </label>
              <label>
                <span>修图提示词</span>
                <textarea name="prompt" rows="7"></textarea>
              </label>
              <div class="grid-2">
                <label>
                  <span>尺寸</span>
                  <select name="size">
                    <option value="1024x1024">1024x1024</option>
                    <option value="1024x1536">1024x1536</option>
                    <option value="1536x1024">1536x1024</option>
                  </select>
                </label>
                <label>
                  <span>质量</span>
                  <select name="quality">
                    <option value="low">low</option>
                    <option value="medium" selected>medium</option>
                    <option value="high">high</option>
                  </select>
                </label>
              </div>
              <div class="cost-line">预计扣点：<span id="editCost">1.000</span></div>
              <button type="submit" class="primary-button">开始修图</button>
            </form>
          </section>

          <section class="panel result-panel">
            <div class="panel-head">
              <h2>输出</h2>
              <button id="clearResults" type="button">清空</button>
            </div>
            <div id="message" class="message hidden"></div>
            <div id="paymentBox" class="payment-box hidden"></div>
            <div id="resultGrid" class="result-grid"></div>
          </section>

          <section id="adminPanel" class="panel admin-panel hidden">
            <div class="panel-head">
              <h2>管理</h2>
              <button id="refreshAdmin" type="button">刷新</button>
            </div>
            <form id="planForm" class="admin-form">
              <input name="code" placeholder="code" required />
              <input name="name" placeholder="名称" required />
              <input name="price_yuan" type="number" min="0" step="0.01" placeholder="价格(元)" required />
              <input name="credits" type="number" min="0.001" step="0.001" placeholder="图点" required />
              <input name="validity_days" type="number" min="1" max="3650" step="1" value="31" placeholder="有效期(天)" required />
              <input name="sort_order" type="hidden" value="100" />
              <input name="description" placeholder="说明" />
              <label class="row-check"><input name="active" type="checkbox" checked /> 上架</label>
              <button id="planSubmit" type="submit">保存套餐</button>
              <button id="resetPlanForm" type="button">新建</button>
            </form>
            <div>
              <h3>套餐</h3>
              <div id="adminPlans" class="list admin-plan-list"></div>
            </div>
            <div class="admin-lists">
              <div>
                <h3>用户</h3>
                <form id="adminUserSearchForm" class="admin-filter">
                  <input id="adminUserSearch" name="q" placeholder="邮箱 / 用户 ID" />
                  <button type="submit">搜索</button>
                </form>
                <div id="adminUsers" class="list"></div>
              </div>
              <div>
                <h3>订单</h3>
                <form id="adminOrderSearchForm" class="admin-filter has-status">
                  <input id="adminOrderSearch" name="q" placeholder="订单号 / 邮箱 / 用户 ID" />
                  <select id="adminOrderStatus" name="status">
                    <option value="">全部状态</option>
                    <option value="pending">待支付</option>
                    <option value="paid">已支付</option>
                    <option value="refunding">退款中</option>
                    <option value="refunded">已退款</option>
                    <option value="closed">已关闭</option>
                  </select>
                  <button type="submit">搜索</button>
                </form>
                <div id="adminOrders" class="list"></div>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="/config.js"></script>
    <script>
      (() => {
        const cardRuntimeConfig = window.RUNTIME_CONFIG || {};
        const runtimeCardApi = String(cardRuntimeConfig.XAI_CARD_API || "").trim();
        const shouldHideRuntimeCard = ["1", "true", "yes", "on"].includes(
          String(cardRuntimeConfig.XAI_HIDE_CARD || "").trim().toLowerCase(),
        );
        const defaultCardApiUrl = "https://api.xabcstack.com/x-card/pk-XvslQZdpHzWMZM9wYMeYZ9AEJTLTO";

        if (shouldHideRuntimeCard) return;

        const existingCardConfig = window.XaiCardConfig || {};
        window.XaiCardConfig = {
          ...existingCardConfig,
          api: existingCardConfig.api || runtimeCardApi || defaultCardApiUrl,
          mode: existingCardConfig.mode || "mini",
        };

        let cardLoaded = false;
        const loadRuntimeCard = () => {
          if (cardLoaded) return;
          cardLoaded = true;
          const runtimeCardScript = document.createElement("script");
          runtimeCardScript.async = true;
          runtimeCardScript.src = "https://xabcstack.com/xapi/card.js";
          document.body.appendChild(runtimeCardScript);
        };

        const scheduleRuntimeCard = () => {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadRuntimeCard, { timeout: 2500 });
          } else {
            window.setTimeout(loadRuntimeCard, 800);
          }
        };

        if (document.readyState === "complete") {
          scheduleRuntimeCard();
        } else {
          window.addEventListener("load", scheduleRuntimeCard, { once: true });
        }
      })();
    </script>
    <script src="/assets/qrcode.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
